<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrow vs WASD Sequence Test</title>
<style>
  :root{--bg:#12101f;--card:#1e1a33;--fg:#f2efff;--mut:#8f89b3;--acc:#ff4fa3;--ok:#3ddc97;--bad:#ff5c5c;--cur:#ffd24a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:760px;background:var(--card);border-radius:20px;padding:28px;text-align:center}
  h1{margin:0 0 6px;font-size:1.6rem}
  p{color:var(--mut);line-height:1.6}
  button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:1.05rem;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.1)}
  .hud{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem;margin-bottom:18px}
  .mode{font-weight:700;color:var(--acc)}
  .seq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0;min-height:76px}
  .key{width:64px;height:64px;border-radius:14px;background:#2d2750;display:flex;align-items:center;justify-content:center;font-size:2rem;line-height:1;font-weight:800;border:3px solid transparent;transition:.08s}
  .key svg{display:block}
  .key.cur{border-color:var(--cur);transform:translateY(-4px)}
  .key.done{background:var(--ok);color:#0b2a1c}
  .seq.shake{animation:sh .25s}
  @keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .timer{font-size:2.6rem;font-variant-numeric:tabular-nums;font-weight:700}
  .big{font-size:5rem;font-weight:800;color:var(--cur);margin:30px 0}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-variant-numeric:tabular-nums}
  th,td{padding:8px;border-bottom:1px solid #342e57}
  th{color:var(--mut);font-weight:600}
  .sum{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
  .box{background:#2d2750;border-radius:14px;padding:14px}
  .box h3{margin:0 0 6px;color:var(--acc)}
  .avg{font-size:1.8rem;font-weight:800}
  .win{outline:2px solid var(--ok)}
  #lb{margin:18px 0;text-align:left}
  .lbh{margin:0 0 6px;color:var(--acc);text-align:center}
  #lb td:nth-child(2){text-align:left}
  #lb-submit{margin:14px 0}
  input{background:#2d2750;color:var(--fg);border:2px solid #342e57;border-radius:10px;padding:10px 12px;font-size:1rem;max-width:100%}
  #sendmsg{color:var(--bad);margin-top:6px}
  @media(max-width:520px){.key{width:46px;height:46px;font-size:1.4rem}.sum{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const ROUNDS = 5, MIN_LEN = 6, MAX_LEN = 8;
const DIRS = ['up','left','down','right'];
const ARROW = {up:'↑',left:'←',down:'↓',right:'→'};
const WASD  = {up:'W',left:'A',down:'S',right:'D'};
const KEYMAP = {ArrowUp:'up',ArrowLeft:'left',ArrowDown:'down',ArrowRight:'right',KeyW:'up',KeyA:'left',KeyS:'down',KeyD:'right'}; // ใช้ e.code เพื่อให้ทำงานแม้คีย์บอร์ดเป็นภาษาไทย
const app = document.getElementById('app');

let order, modeIdx, round, seq, pos, mistakes, t0, raf, phase, seqs;
let results; // {arrow:[{ms,mistakes}], wasd:[...]}

const rnd = n => Math.floor(Math.random()*n);
const fmt = ms => (ms/1000).toFixed(2)+' s';

function intro(){
  phase='intro';
  app.innerHTML = `
    <h1>ทดสอบ Sequence: ลูกศร vs WASD</h1>
    <p>เล่นทั้งสองแบบ แบบละ ${ROUNDS} รอบ รอบละสุ่ม ${MIN_LEN}-${MAX_LEN} ตัว<br>
    กดได้ทั้ง <b>ลูกศร</b> และ <b>WASD</b> (W=↑ A=← S=↓ D=→) ไม่ว่า UI จะโชว์แบบไหน<br>
    ถ้ากดผิด ลำดับจะเริ่มใหม่ตั้งแต่ตัวแรก (เวลายังเดินต่อ)<br>
    ด่านที่ N ของทั้งสองแบบมีทิศทางปุ่มชุดเดียวกัน (ต่างกันแค่ UI) และเวลาเริ่มนับตอนกดปุ่มแรก (ดู sequence ได้ก่อนโดยไม่เสียเวลา)</p>
    <button id="start">เริ่มเลย</button><div id="lb"></div>`;
  document.getElementById('start').onclick = startAll;
  loadBoard();
}

function startAll(){
  order = Math.random()<.5 ? ['arrow','wasd'] : ['wasd','arrow']; // สลับลำดับเพื่อลด bias
  results = {arrow:[],wasd:[]};
  // แต่ละด่านใช้ลำดับทิศทางชุดเดียวกันทั้งสองโหมด (ต่างกันแค่ UI)
  seqs = Array.from({length:ROUNDS},()=>Array.from({length:MIN_LEN + rnd(MAX_LEN-MIN_LEN+1)},()=>DIRS[rnd(4)]));
  modeIdx = 0; round = 0;
  nextRound();
}

function nextRound(){
  const mode = order[modeIdx];
  seq = seqs[round];
  pos = 0; mistakes = 0; phase='play'; t0 = null;
  render(mode, true);
}

const ROT = {up:0,right:90,down:180,left:270};
// ลูกศร SVG หนา อยู่กึ่งกลางช่องพอดี (ไม่ขึ้นกับฟอนต์)
function arrowSVG(d){
  return `<svg viewBox="0 0 24 24" width="70%" height="70%" aria-hidden="true"><path transform="rotate(${ROT[d]} 12 12)" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M12 2.5 L22 12.5 H15.5 V21.5 H8.5 V12.5 H2 Z"/></svg>`;
}

function render(mode, ready){
  const lab = mode==='arrow' ? 'UI ลูกศร' : 'UI WASD';
  const map = mode==='arrow' ? ARROW : WASD;
  app.innerHTML = `
    <div class="hud"><span class="mode">${lab}</span><span>รอบ ${round+1}/${ROUNDS} · โหมด ${modeIdx+1}/2</span></div>
    <div class="big" id="go" style="font-size:2rem;margin:6px 0">กดปุ่มแรกเพื่อเริ่มจับเวลา</div>
    <div class="seq" id="seq">${seq.map((d,i)=>`<div class="key" data-i="${i}">${mode==='arrow'?arrowSVG(d):map[d]}</div>`).join('')}</div>
    <div class="timer" id="time">0.00 s</div>
    <p id="hint">ผิด: <span id="mis">0</span></p>`;
  paint();
}

function paint(){
  document.querySelectorAll('.key').forEach((k,i)=>{
    k.classList.toggle('done', i<pos);
    k.classList.toggle('cur', i===pos);
  });
  const m=document.getElementById('mis'); if(m) m.textContent=mistakes;
}

function tick(){
  if(phase!=='play') return;
  document.getElementById('time').textContent = fmt(performance.now()-t0);
  raf = requestAnimationFrame(tick);
}

addEventListener('keydown', e=>{
  const d = KEYMAP[e.code];
  if(!d) return;
  if(phase!=='play') return;
  e.preventDefault();
  if(t0===null){ t0 = performance.now(); document.getElementById('go').textContent='GO!'; tick(); }
  if(d===seq[pos]){
    pos++;
    if(pos===seq.length) return finishRound();
  } else {
    mistakes++; pos=0;
    const s=document.getElementById('seq'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
  }
  paint();
});

function finishRound(){
  const ms = performance.now()-t0;
  phase='between'; cancelAnimationFrame(raf);
  document.getElementById('time').textContent = fmt(ms);
  paint();
  results[order[modeIdx]].push({ms,mistakes,len:seq.length});
  round++;
  setTimeout(()=>{
    if(round>=ROUNDS){ round=0; modeIdx++; }
    if(modeIdx>=2) return showResults();
    if(round===0) return modeBreak();
    nextRound();
  }, 700);
}

function modeBreak(){
  phase='break';
  const lab = order[modeIdx]==='arrow' ? 'UI ลูกศร' : 'UI WASD';
  app.innerHTML = `<h1>จบโหมดแรก</h1><p>ต่อไปเป็น <b>${lab}</b> อีก ${ROUNDS} รอบ</p><button id="c">ไปต่อ</button>`;
  document.getElementById('c').onclick = nextRound;
}

function stats(r){
  const total=r.reduce((a,x)=>a+x.ms,0);
  return {total, avg:total/r.length, mis:r.reduce((a,x)=>a+x.mistakes,0)};
}

function showResults(){
  phase='done';
  const a=stats(results.arrow), w=stats(results.wasd);
  const col=(name,key,s)=>`
    <div class="box ${s.avg<(key==='arrow'?w:a).avg?'win':''}">
      <h3>${name}</h3>
      <table>${results[key].map((x,i)=>`<tr><td>รอบ ${i+1} (${x.len} ตัว)</td><td>${fmt(x.ms)}</td><td>ผิด ${x.mistakes}</td></tr>`).join('')}</table>
      <div>รวม <b>${fmt(s.total)}</b></div>
      <div>เฉลี่ย/รอบ</div><div class="avg">${fmt(s.avg)}</div>
      <div style="color:var(--mut)">ผิดรวม ${s.mis}</div>
    </div>`;
  const diff=Math.abs(a.avg-w.avg), better=a.avg<w.avg?'ลูกศร':'WASD';
  app.innerHTML = `<h1>ผลการทดสอบ</h1>
    <div class="sum">${col('ลูกศร ↑←↓→','arrow',a)}${col('WASD','wasd',w)}</div>
    <p>เฉลี่ย <b>${better}</b> เร็วกว่า ${fmt(diff)} ต่อรอบ</p>
    <div id="lb-submit"></div><div id="lb"></div><button id="again">เล่นอีกครั้ง</button>`;
  document.getElementById('again').onclick = startAll;
  submitForm(a, w);
  loadBoard();
}

// ---------- Leaderboard (Supabase) ----------
const SB_URL = 'https://jbbowdyzpnfcehzdqytw.supabase.co';
const SB_KEY = 'sb_publishable_7SVmEo3Uf8NCsmAxgvKmDw_vKVsfs0A'; // publishable key: ปลอดภัยที่จะอยู่ในเว็บ (ตาราง scores เปิด RLS อ่านอย่างเดียว)
const SB_HEAD = {apikey:SB_KEY, Authorization:'Bearer '+SB_KEY};

async function loadBoard(){
  const el = document.getElementById('lb'); if(!el) return;
  el.innerHTML = '<p>กำลังโหลดอันดับ…</p>';
  try{
    const r = await fetch(SB_URL+'/rest/v1/scores?select=nickname,total_ms,arrow_total_ms,wasd_total_ms&order=total_ms.asc&limit=20',{headers:SB_HEAD});
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    const box = document.getElementById('lb'); if(!box) return;
    box.innerHTML = '<h3 class="lbh">Leaderboard (เวลารวม 10 รอบ)</h3>';
    if(!rows.length){ box.innerHTML += '<p>ยังไม่มีคะแนน มาเป็นคนแรกเลย</p>'; return; }
    const t = document.createElement('table');
    t.innerHTML = '<tr><th>#</th><th>ชื่อ</th><th>รวม</th><th>ลูกศร</th><th>WASD</th></tr>';
    rows.forEach((x,i)=>{
      const tr = document.createElement('tr');
      [i+1, x.nickname, fmt(x.total_ms), fmt(x.arrow_total_ms), fmt(x.wasd_total_ms)].forEach(v=>{
        const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    box.appendChild(t);
  }catch(err){
    const box = document.getElementById('lb'); if(box) box.innerHTML = '<p>โหลดอันดับไม่ได้ ลองรีเฟรชหน้า</p>';
  }
}

function submitForm(a, w){
  const box = document.getElementById('lb-submit');
  box.innerHTML = '<input id="nick" maxlength="16" placeholder="ชื่อเล่น (ไม่เกิน 16 ตัว)" autocomplete="off"> <button id="send">ส่งคะแนน</button> <div id="sendmsg"></div>';
  document.getElementById('send').onclick = async ()=>{
    const name = document.getElementById('nick').value.trim();
    const msg = document.getElementById('sendmsg');
    if(!name){ msg.textContent = 'ใส่ชื่อเล่นก่อน'; return; }
    document.getElementById('send').disabled = true;
    try{
      const r = await fetch(SB_URL+'/rest/v1/rpc/submit_score',{method:'POST',headers:{...SB_HEAD,'Content-Type':'application/json'},
        body:JSON.stringify({p_nickname:name,p_arrow_total_ms:Math.round(a.total),p_wasd_total_ms:Math.round(w.total)})});
      if(!r.ok) throw new Error(r.status);
      box.innerHTML = '<p>ส่งคะแนนแล้ว</p>';
      loadBoard();
    }catch(err){
      msg.textContent = 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง';
      document.getElementById('send').disabled = false;
    }
  };
}
intro();
</script>
</body>
</html>
